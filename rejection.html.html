<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factory Rejection Tracker</title>
    <style>
        /* --- CSS Styling --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 1100px;
            margin-bottom: 20px;
        }

        h2, h3 {
            color: #333;
            border-bottom: 2px solid #0056b3;
            padding-bottom: 10px;
            margin-top: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .full-width {
            grid-column: span 2;
        }

        label {
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }

        input, select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #0056b3;
        }
        
        input[readonly] {
            background-color: #e9ecef;
            cursor: not-allowed;
            color: #495057;
            font-weight: bold;
        }

        button {
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-weight: bold;
        }

        .btn-primary { background-color: #0056b3; width: 100%; }
        .btn-primary:hover { background-color: #004494; }
        
        .btn-warning { background-color: #ffc107; color: #212529; width: 100%; }
        .btn-warning:hover { background-color: #e0a800; }

        .btn-download-xls { background-color: #17a2b8; flex: 1; }
        .btn-download-xls:hover { background-color: #138496; }

        .btn-download-csv { background-color: #6c757d; flex: 1; }
        .btn-download-csv:hover { background-color: #5a6268; }

        .btn-success { background-color: #28a745; flex: 1; }
        .btn-success:hover { background-color: #218838; }

        .btn-print { background-color: #343a40; flex: 1; }
        .btn-print:hover { background-color: #23272b; }

        .btn-danger { background-color: #dc3545; padding: 8px 12px; font-size: 12px; }
        .btn-danger:hover { background-color: #c82333; }
        
        .btn-secondary { background-color: #6c757d; padding: 8px 12px; font-size: 13px; }
        .btn-secondary:hover { background-color: #5a6268; }

        .row-action-group {
            display: flex;
            gap: 5px;
            justify-content: center;
        }

        .btn-delete-row { background-color: #dc3545; padding: 5px 10px; font-size: 12px; border-radius: 4px; color: white; border: none; cursor: pointer; }
        .btn-edit-row { background-color: #ffc107; padding: 5px 10px; font-size: 12px; border-radius: 4px; color: #212529; border: none; cursor: pointer; }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            width: 100%;
            flex-wrap: wrap;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 14px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
            vertical-align: middle;
        }

        th {
            background-color: #f8f9fa;
            color: #333;
        }

        th.action-col, td.action-col { text-align: center; }

        .empty-message { text-align: center; color: #777; font-style: italic; padding: 20px; }
        
        /* Different background colors to distinguish Daily vs Monthly sections */
        .daily-box { background-color: #fdfbf7; border: 1px solid #e2d9c8; }
        .monthly-box { background-color: #f4f7f9; border: 1px solid #d1dbe0; }

        .thumbnail {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid #ccc;
            margin-right: 5px;
            cursor: pointer;
        }

        .filter-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        /* --- PRINT STYLES --- */
        @media print {
            body { background-color: white; padding: 0; }
            
            /* Hide the container not being printed based on the body class */
            body.print-daily .container:not(.daily-box) { display: none !important; }
            body.print-monthly .container:not(.monthly-box) { display: none !important; }
            
            /* Clean up the container being printed */
            .container { box-shadow: none; border: none; padding: 0; max-width: 100%; margin: 0; }
            
            /* Hide buttons and interactive elements for a clean paper print */
            .action-buttons, .filter-header button, .btn-danger, .action-col, th.action-col, td.action-col { 
                display: none !important; 
            }
            
            /* Print the input values as text so the user knows the filter context */
            input[type="date"], input[type="month"] { border: none; font-weight: bold; }
        }
    </style>
</head>
<body>

    <!-- INPUT FORM -->
    <div class="container">
        <h2>Enter / Edit Rejection Data</h2>
        <div class="form-grid">
            <div class="form-group">
                <label for="trackingDate">Date (Auto-updates):</label>
                <input type="date" id="trackingDate" required>
            </div>
            <div class="form-group">
                <label for="department">Department:</label>
                <input type="text" id="department" placeholder="Enter department name">
            </div>
            <div class="form-group">
                <label for="partName">Part Name / Number:</label>
                <input type="text" id="partName" placeholder="e.g., Gearbox A12">
            </div>
            <div class="form-group">
                <label for="defectType">Defect Type:</label>
                <input type="text" id="defectType" placeholder="Enter defect description">
            </div>
            <div class="form-group">
                <label for="okQty">OK Quantity:</label>
                <input type="number" id="okQty" min="0" placeholder="0" oninput="calculateTotal()">
            </div>
            <div class="form-group">
                <label for="rejQty">Rejected Quantity:</label>
                <input type="number" id="rejQty" min="0" placeholder="0" oninput="calculateTotal()">
            </div>
            <div class="form-group full-width">
                <label for="totalQty">Total Quantity:</label>
                <input type="number" id="totalQty" readonly placeholder="Auto-calculated sum of OK and Rejected">
            </div>
            <div class="form-group full-width">
                <label for="defectImages">Upload Defect Images (Multiple allowed):</label>
                <input type="file" id="defectImages" multiple accept="image/*">
            </div>
            <div class="form-group full-width">
                <button type="button" id="saveButton" class="btn-primary" onclick="handleSaveRecord()">+ Save Record</button>
            </div>
        </div>
    </div>

    <!-- DAILY DETAILED RECORDS -->
    <div class="container daily-box">
        <div class="filter-header">
            <label for="dayFilter"><strong>📅 Filter Daily Records:</strong></label>
            <input type="date" id="dayFilter" onchange="updateTables()">
            <button type="button" class="btn-secondary" onclick="clearFilter('day')">Clear Date Filter</button>
        </div>
        
        <h3><span id="dailyTableTitle">Daily Detailed Records</span></h3>
        <table id="dailyTable">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Dept</th>
                    <th>Part</th>
                    <th>Defect</th>
                    <th>Total</th>
                    <th>OK</th>
                    <th>Rej</th>
                    <th>Rej %</th>
                    <th>Images</th>
                    <th class="action-col">Action</th>
                </tr>
            </thead>
            <tbody id="dailyTableBody">
                <tr><td colspan="10" class="empty-message">No records found.</td></tr>
            </tbody>
        </table>

        <div class="action-buttons">
            <button type="button" class="btn-print" onclick="printSection('daily')">🖨 Print Daily</button>
            <button type="button" class="btn-download-xls" onclick="downloadExcelFile('daily')">📊 Download Excel (Images)</button>
            <button type="button" class="btn-download-csv" onclick="downloadCSVFile('daily')">📄 Download CSV (Text)</button>
            <button type="button" class="btn-success" onclick="shareViaMail('daily')">✉ Share Daily Mail</button>
        </div>
    </div>

    <!-- MONTHLY DETAILED RECORDS -->
    <div class="container monthly-box">
        <div class="filter-header">
            <label for="monthFilter"><strong>📅 Filter Monthly Records:</strong></label>
            <input type="month" id="monthFilter" onchange="updateTables()">
            <button type="button" class="btn-secondary" onclick="clearFilter('month')">Clear Month Filter</button>
        </div>
        
        <h3>
            <span id="monthlyTableTitle">Monthly Detailed Records</span>
            <button type="button" class="btn-danger" onclick="clearAllData()">🗑 Clear ALL Data</button>
        </h3>
        <table id="monthlyTable">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Dept</th>
                    <th>Part</th>
                    <th>Defect</th>
                    <th>Total</th>
                    <th>OK</th>
                    <th>Rej</th>
                    <th>Rej %</th>
                    <th>Images</th>
                    <th class="action-col">Action</th>
                </tr>
            </thead>
            <tbody id="monthlyTableBody">
                <tr><td colspan="10" class="empty-message">No records found.</td></tr>
            </tbody>
        </table>

        <div class="action-buttons">
            <button type="button" class="btn-print" onclick="printSection('monthly')">🖨 Print Monthly</button>
            <button type="button" class="btn-download-xls" onclick="downloadExcelFile('monthly')">📊 Download Excel (Images)</button>
            <button type="button" class="btn-download-csv" onclick="downloadCSVFile('monthly')">📄 Download CSV (Text)</button>
            <button type="button" class="btn-success" onclick="shareViaMail('monthly')">✉ Share Monthly Mail</button>
        </div>
    </div>

    <script>
        /* --- JavaScript Functionality --- */
        let records = JSON.parse(localStorage.getItem('factoryRecords')) || [];
        let editIndex = -1; 

        window.onload = function() {
            // Set defaults to today's date and current month
            const today = new Date();
            const dateString = today.toISOString().split('T')[0];
            const monthString = dateString.substring(0, 7);
            
            document.getElementById('trackingDate').value = dateString;
            document.getElementById('dayFilter').value = dateString;
            document.getElementById('monthFilter').value = monthString;
            
            updateTables(); 
        };

        // --- Print Functionality ---
        function printSection(type) {
            // Apply a specific class to the body so CSS knows which part to print
            document.body.className = 'print-' + type;
            window.print();
            // Remove the class immediately after the print dialog closes
            document.body.className = '';
        }

        function calculateTotal() {
            const ok = parseInt(document.getElementById('okQty').value) || 0;
            const rej = parseInt(document.getElementById('rejQty').value) || 0;
            document.getElementById('totalQty').value = ok + rej;
        }

        function clearFilter(type) {
            if(type === 'day') document.getElementById('dayFilter').value = '';
            if(type === 'month') document.getElementById('monthFilter').value = '';
            updateTables();
        }

        function processImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = function(event) {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 300; const MAX_HEIGHT = 300; 
                        let width = img.width; let height = img.height;
                        if (width > height) {
                            if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                        } else {
                            if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                        }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.6)); 
                    };
                };
                reader.onerror = reject;
            });
        }

        async function handleSaveRecord() {
            const date = document.getElementById('trackingDate').value;
            const department = document.getElementById('department').value;
            const partName = document.getElementById('partName').value;
            const defectType = document.getElementById('defectType').value;
            const okQty = parseInt(document.getElementById('okQty').value) || 0;
            const rejQty = parseInt(document.getElementById('rejQty').value) || 0;
            const totalQty = okQty + rejQty; 

            if(!department || !partName || !defectType || document.getElementById('okQty').value === '' || document.getElementById('rejQty').value === '') {
                alert("Please fill in all text fields and quantities.");
                return;
            }

            let rejPercent = totalQty > 0 ? ((rejQty / totalQty) * 100).toFixed(2) + "%" : "0.00%";
            const files = document.getElementById('defectImages').files;
            let imagesArray = [];

            if (files.length > 0) {
                document.getElementById('saveButton').textContent = "Saving... Please wait";
                document.getElementById('saveButton').disabled = true;
                for (let i = 0; i < files.length; i++) {
                    try { imagesArray.push(await processImage(files[i])); } 
                    catch(e) { console.error(e); }
                }
            }

            if (editIndex > -1 && files.length === 0) imagesArray = records[editIndex].images || [];

            const recordData = { date, department, partName, defectType, totalQty, okQty, rejQty, rejPercent, images: imagesArray };

            try {
                if (editIndex > -1) { records[editIndex] = recordData; editIndex = -1; } 
                else { records.push(recordData); }

                records.sort((a, b) => new Date(b.date) - new Date(a.date)); // Sort latest first
                localStorage.setItem('factoryRecords', JSON.stringify(records));
            } catch (e) {
                alert("Storage limit reached! Please clear old records.");
                records = JSON.parse(localStorage.getItem('factoryRecords')) || []; 
            } finally {
                document.getElementById('saveButton').disabled = false;
                document.getElementById('saveButton').textContent = "+ Save Record";
                document.getElementById('saveButton').className = "btn-primary";
            }

            // Also auto-update the date filters to match the newly added record
            document.getElementById('dayFilter').value = date;
            document.getElementById('monthFilter').value = date.substring(0, 7);

            updateTables();
            
            // Clear specific fields (leave date)
            document.getElementById('department').value = '';
            document.getElementById('partName').value = '';
            document.getElementById('defectType').value = '';
            document.getElementById('okQty').value = '';
            document.getElementById('rejQty').value = '';
            document.getElementById('totalQty').value = '';
            document.getElementById('defectImages').value = '';
            document.getElementById('department').focus();
        }

        function editSpecificRecord(index) {
            const actualRecord = records[index];
            document.getElementById('trackingDate').value = actualRecord.date;
            document.getElementById('department').value = actualRecord.department;
            document.getElementById('partName').value = actualRecord.partName;
            document.getElementById('defectType').value = actualRecord.defectType;
            document.getElementById('okQty').value = actualRecord.okQty;
            document.getElementById('rejQty').value = actualRecord.rejQty;
            calculateTotal(); 
            editIndex = index; 
            const saveBtn = document.getElementById('saveButton');
            saveBtn.textContent = "✎ Update Record";
            saveBtn.className = "btn-warning";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function getFilteredRecords(type) {
            if (type === 'daily') {
                const dayFilter = document.getElementById('dayFilter').value;
                if (!dayFilter) return records;
                return records.filter(row => row.date === dayFilter);
            } else if (type === 'monthly') {
                const monthFilter = document.getElementById('monthFilter').value;
                if (!monthFilter) return records;
                return records.filter(row => row.date.startsWith(monthFilter));
            }
            return records;
        }

        function generateRowHTML(row, originalIndex) {
            let imageHTML = "<em>No Image</em>";
            if (row.images && row.images.length > 0) {
                imageHTML = row.images.map(img => `<img src="${img}" class="thumbnail" onclick="window.open('${img}')" title="Click to view">`).join('');
            }
            return `
                <tr>
                    <td>${row.date}</td>
                    <td>${row.department}</td>
                    <td>${row.partName}</td>
                    <td>${row.defectType}</td>
                    <td>${row.totalQty}</td>
                    <td>${row.okQty}</td>
                    <td>${row.rejQty}</td>
                    <td style="font-weight: bold; color: ${parseFloat(row.rejPercent) > 5 ? 'red' : 'green'};">${row.rejPercent}</td>
                    <td>${imageHTML}</td>
                    <td class="action-col">
                        <div class="row-action-group">
                            <button type="button" class="btn-edit-row" title="Edit" onclick="editSpecificRecord(${originalIndex})">✎</button>
                            <button type="button" class="btn-delete-row" title="Delete" onclick="deleteSpecificRecord(${originalIndex})">✖</button>
                        </div>
                    </td>
                </tr>
            `;
        }

        function updateTables() {
            // Update Daily
            const dailyRecords = getFilteredRecords('daily');
            const dailyBody = document.getElementById('dailyTableBody');
            const dailyVal = document.getElementById('dayFilter').value;
            document.getElementById('dailyTableTitle').textContent = dailyVal ? `Daily Records for: ${dailyVal}` : 'All Records (No Day Filter)';
            
            if(dailyRecords.length === 0) dailyBody.innerHTML = '<tr><td colspan="10" class="empty-message">No records found for this date.</td></tr>';
            else dailyBody.innerHTML = dailyRecords.map(row => generateRowHTML(row, records.indexOf(row))).join('');

            // Update Monthly
            const monthlyRecords = getFilteredRecords('monthly');
            const monthlyBody = document.getElementById('monthlyTableBody');
            const monthlyVal = document.getElementById('monthFilter').value;
            document.getElementById('monthlyTableTitle').textContent = monthlyVal ? `Monthly Records for: ${monthlyVal}` : 'All Records (No Month Filter)';
            
            if(monthlyRecords.length === 0) monthlyBody.innerHTML = '<tr><td colspan="10" class="empty-message">No records found for this month.</td></tr>';
            else monthlyBody.innerHTML = monthlyRecords.map(row => generateRowHTML(row, records.indexOf(row))).join('');
        }

        function deleteSpecificRecord(index) {
            if (confirm("Are you sure you want to delete this specific record?")) {
                records.splice(index, 1);
                if (editIndex === index) {
                    editIndex = -1;
                    document.getElementById('saveButton').textContent = "+ Save Record";
                    document.getElementById('saveButton').className = "btn-primary";
                } else if (editIndex > index) {
                    editIndex--;
                }
                localStorage.setItem('factoryRecords', JSON.stringify(records));
                updateTables();
            }
        }

        function clearAllData() {
            if (confirm("Are you sure you want to delete ALL saved records? This cannot be undone.")) {
                records = [];
                localStorage.removeItem('factoryRecords');
                editIndex = -1;
                updateTables();
            }
        }

        /* --- EXPORT FUNCTIONS --- */
        function downloadExcelFile(type) {
            const displayedRecords = getFilteredRecords(type);
            if (displayedRecords.length === 0) return alert("No records to download.");
            
            const filterInput = type === 'daily' ? document.getElementById('dayFilter').value : document.getElementById('monthFilter').value;
            const filterText = filterInput ? `(${filterInput})` : '';

            let htmlContent = `
                <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel">
                <head>
                    <meta charset="utf-8">
                    <style>
                        table { border-collapse: collapse; width: 100%; }
                        th, td { border: 1px solid black; padding: 5px; text-align: left; vertical-align: middle; }
                        .excel-img { margin-right: 5px; display: inline-block; vertical-align: middle; }
                    </style>
                </head>
                <body>
                    <table>
                        <tr>
                            <th colspan="9" style="color: darkred; font-size: 20px; font-weight: bold; text-align: center; background-color: #f4f4f4; padding: 10px;">
                                ${type.toUpperCase()} Rejection Data ${filterText}
                            </th>
                        </tr>
                        <tr>
                            <th>Date</th><th>Department</th><th>Part Name</th><th>Defect Type</th>
                            <th>Total Qty</th><th>OK Qty</th><th>Rejected Qty</th><th>Rejection %</th><th>Defect Images</th>
                        </tr>
            `;
            
            displayedRecords.forEach(row => {
                let imgContent = '';
                if (row.images && row.images.length > 0) {
                    imgContent = row.images.map(img => `<img class="excel-img" src="${img}" height="50">`).join(' ');
                }
                htmlContent += `
                    <tr style="height: 60px;">
                        <td>${row.date}</td><td>${row.department}</td><td>${row.partName}</td><td>${row.defectType}</td>
                        <td>${row.totalQty}</td><td>${row.okQty}</td><td>${row.rejQty}</td><td>${row.rejPercent}</td>
                        <td style="white-space: nowrap;">${imgContent}</td>
                    </tr>
                `;
            });

            htmlContent += `</table></body></html>`;
            const fileName = `Factory_${type}_Data_${new Date().toISOString().split('T')[0]}.xls`;
            const blob = new Blob([htmlContent], { type: 'application/vnd.ms-excel' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url); link.setAttribute("download", fileName);
            document.body.appendChild(link); link.click(); document.body.removeChild(link); URL.revokeObjectURL(url);
        }

        function downloadCSVFile(type) {
            const displayedRecords = getFilteredRecords(type);
            if (displayedRecords.length === 0) return alert("No records to download.");

            let csvContent = "Date,Department,Part Name,Defect Type,Total Qty,OK Qty,Rejected Qty,Rejection %,Has Image?\n";
            displayedRecords.forEach(row => {
                const hasImage = (row.images && row.images.length > 0) ? "Yes" : "No";
                csvContent += `${row.date},"${row.department}","${row.partName}","${row.defectType}",${row.totalQty},${row.okQty},${row.rejQty},"${row.rejPercent}","${hasImage}"\n`;
            });

            const fileName = `Factory_${type}_Data_TextOnly_${new Date().toISOString().split('T')[0]}.csv`;
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url); link.setAttribute("download", fileName);
            document.body.appendChild(link); link.click(); document.body.removeChild(link); URL.revokeObjectURL(url);
        }

        function shareViaMail(type) {
            const displayedRecords = getFilteredRecords(type);
            if (displayedRecords.length === 0) return alert("No records to share.");

            let summaryText = "Date | Dept | Part | Defect | Total | OK | Rej | Rej %\n------------------------------------------------------------------\n";
            displayedRecords.forEach(row => {
                summaryText += `${row.date} | ${row.department} | ${row.partName} | ${row.defectType} | ${row.totalQty} | ${row.okQty} | ${row.rejQty} | ${row.rejPercent}\n`;
            });

            const emailSubject = encodeURIComponent(`Factory ${type.charAt(0).toUpperCase() + type.slice(1)} Rejection Data`);
            const emailBody = encodeURIComponent(`Hello,\n\nPlease find the latest rejection data below:\n\n${summaryText}\n\n[Note: Please find the downloaded Data file attached.]\n\nRegards,\n[Your Name]`);
            window.location.href = `mailto:?subject=${emailSubject}&body=${emailBody}`;
        }
    </script>
</body>
</html>
