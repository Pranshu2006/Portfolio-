<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> 
    <title>Digital Notebook</title>
    <style>
        /* ==================== STYLES ==================== */
        :root {
            --bg-gradient: linear-gradient(180deg, #2b1055 0%, #4facfe 100%); 
            --card-bg: #2b2b3d; 
            --btn-gradient: linear-gradient(90deg, #ff512f, #dd2476);
            --title-gradient: linear-gradient(to right, #ff9966, #ff5e62);
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: white;
            box-sizing: border-box;
            overscroll-behavior-y: contain; 
        }

        .app-container {
            max-width: 500px;
            margin: 0 auto;
            padding-bottom: 50px;
        }

        /* --- Header Section --- */
        header { text-align: center; margin-bottom: 25px; margin-top: 20px; }
        
        header h1 { 
            margin: 0; 
            font-size: 2.5rem; 
            font-weight: 800;
            background: var(--title-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 4px 10px rgba(0,0,0,0.2);
        }
        
        header p { 
            color: #e0e0e0; 
            margin-top: 8px; 
            font-size: 0.95rem; 
            font-weight: 500;
        }

        /* --- Form Card --- */
        .form-container {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: #fff;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 14px;
            border-radius: 6px;
            border: none;
            margin-bottom: 18px;
            box-sizing: border-box;
            font-family: inherit;
            background: #ffffff;
            color: #333;
            font-size: 1rem;
        }

        input::placeholder, textarea::placeholder { color: #888; }

        .file-upload-box {
            background-color: #3e3e55;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        input[type="file"] {
            color: #bbb;
            font-size: 0.9rem;
            width: 100%;
        }
        input[type="file"]::file-selector-button {
            border: none;
            background: #eee;
            padding: 8px 12px;
            border-radius: 4px;
            color: #333;
            cursor: pointer;
            margin-right: 10px;
            font-weight: bold;
        }

        .save-btn {
            width: 100%;
            padding: 16px;
            background: var(--btn-gradient);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(221, 36, 118, 0.4);
            transition: transform 0.1s;
        }
        .save-btn:active { transform: scale(0.98); }

        .preview-area {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .preview-item { position: relative; width: 60px; height: 60px; }
        .preview-thumb {
            width: 100%; height: 100%;
            object-fit: cover;
            border-radius: 6px; 
            border: 1px solid #555;
        }
        .remove-img-btn {
            position: absolute; top: -5px; right: -5px;
            background: red; color: white;
            border: none; border-radius: 50%;
            width: 18px; height: 18px;
            font-size: 10px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        /* --- Saved Notes List Styling --- */
        .notes-grid {
            display: flex; flex-direction: column;
            gap: 15px; margin-top: 30px;
        }
        .note-card {
            background: white; color: #333;
            border-radius: 12px; overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .note-body { padding: 15px; }
        .note-title { margin: 0 0 5px 0; color: #222; font-size: 1.1rem;}
        
        /* New Meta Data Styling (Tag + Date) */
        .note-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .note-tag { 
            background: #eee; color: #555; 
            padding: 2px 8px; border-radius: 4px; 
            font-size: 0.75rem; font-weight: bold;
        }
        .note-date {
            font-size: 0.75rem;
            color: #888;
            font-weight: 500;
        }

        .note-gallery {
            display: flex; gap: 2px;
            overflow-x: auto;
            background: #eee; height: 140px;
        }
        .note-gallery img {
            height: 100%; width: auto;
            object-fit: cover; cursor: pointer; flex-shrink: 0;
        }
        .delete-btn {
            margin-top: 10px; background: white;
            color: #d32f2f; border: 1px solid #d32f2f;
            padding: 6px 12px; border-radius: 4px; cursor: pointer;
            font-size: 0.85rem;
        }

        /* ==================== LIGHTBOX ==================== */
        #lightbox {
            display: none;
            position: fixed; z-index: 2000;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: black;
            justify-content: center; align-items: center;
            overflow: hidden;
            touch-action: none; 
        }
        #lightbox img {
            max-width: 100%; max-height: 100%;
            transform-origin: center center;
            will-change: transform; 
        }
        #close-lightbox {
            position: absolute; top: 20px; right: 20px;
            color: white; font-size: 30px; font-weight: bold;
            cursor: pointer; z-index: 2005;
            background: rgba(255, 255, 255, 0.2);
            width: 50px; height: 50px;
            text-align: center; line-height: 50px;
            border-radius: 50%;
            backdrop-filter: blur(5px);
        }
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 40px;
            color: white;
            background: rgba(255,255,255,0.1);
            padding: 10px;
            cursor: pointer;
            z-index: 2002;
            user-select: none;
        }
        #prev-btn { left: 10px; }
        #next-btn { right: 10px; }

    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>Digital Notebook</h1>
        <p>✨Developed 💻 By 🇮🇳 Prayanshu Kumar  ✨</p>
    </header>

    <div class="form-container">
        <label for="title">Title</label>
        <input type="text" id="title" placeholder="Enter a catchy title...">

        <label for="category">Category / Tag</label>
        <input type="text" id="category" placeholder="e.g. Ideas, Work, Dreams">

        <label for="content">Content</label>
        <textarea id="content" rows="4" placeholder="Write your thoughts here..."></textarea>
        
        <label>Attachments (Images)</label>
        <div class="file-upload-box">
            <input type="file" id="imageInput" multiple accept="image/*" onchange="handleImageSelect(event)">
        </div>
        
        <div id="previewArea" class="preview-area"></div>
        
        <button onclick="saveNote()" class="save-btn">Save Note</button>
    </div>

    <div id="notesContainer" class="notes-grid"></div>
</div>

<div id="lightbox" onclick="closeLightbox(event)">
    <div id="close-lightbox" onclick="closeLightbox(event)">&times;</div>
    <div id="prev-btn" class="nav-btn" onclick="prevImage(event)">&#10094;</div>
    <div id="next-btn" class="nav-btn" onclick="nextImage(event)">&#10095;</div>
    <img id="lightbox-img" src="" alt="Full Screen" onclick="event.stopPropagation()">
</div>

<script>
    // =========================================================
    //  LOGIC: INDEXED DB, STORAGE, AND GALLERY
    // =========================================================

    // --- DATABASE SETUP ---
    const DB_NAME = "SwipeNotebookDB";
    const STORE_NAME = "notes";
    let db;
    let currentNoteFormImages = []; 

    window.onload = () => {
        let request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = (e) => {
            db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
                db.createObjectStore(STORE_NAME, { keyPath: "id" });
            }
        };
        request.onsuccess = (e) => {
            db = e.target.result;
            loadNotes();
        };
    };

    // --- IMAGE SELECTION & PREVIEW ---
    function handleImageSelect(event) {
        const files = event.target.files;
        if (!files.length) return;
        Array.from(files).forEach(file => {
            const reader = new FileReader();
            reader.onload = (e) => {
                currentNoteFormImages.push(e.target.result);
                renderPreview();
            };
            reader.readAsDataURL(file);
        });
        event.target.value = '';
    }

    function renderPreview() {
        const area = document.getElementById('previewArea');
        area.innerHTML = '';
        currentNoteFormImages.forEach((imgBase64, index) => {
            const div = document.createElement('div');
            div.className = 'preview-item';
            div.innerHTML = `<img src="${imgBase64}" class="preview-thumb">
                             <button class="remove-img-btn" onclick="removeImage(${index})">×</button>`;
            area.appendChild(div);
        });
    }

    function removeImage(index) {
        currentNoteFormImages.splice(index, 1);
        renderPreview();
    }

    // --- SAVE & LOAD ---
    function saveNote() {
        const title = document.getElementById('title').value;
        const category = document.getElementById('category').value;
        const content = document.getElementById('content').value;
        if(!title) return alert("Title is required");

        // 1. GET CURRENT DATE AND TIME
        const now = new Date();
        const dateString = now.toLocaleDateString() + ' ' + now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

        // 2. INCLUDE DATE IN OBJECT
        const note = { 
            id: Date.now(), 
            title, 
            category, 
            content, 
            images: currentNoteFormImages,
            date: dateString 
        };

        const tx = db.transaction([STORE_NAME], "readwrite");
        tx.objectStore(STORE_NAME).add(note);
        tx.oncomplete = () => {
            loadNotes();
            document.getElementById('title').value = '';
            document.getElementById('content').value = '';
            document.getElementById('category').value = '';
            currentNoteFormImages = [];
            renderPreview();
            alert("Note Saved!");
        };
    }

    function loadNotes() {
        const tx = db.transaction([STORE_NAME], "readonly");
        const req = tx.objectStore(STORE_NAME).getAll();
        req.onsuccess = () => {
            const notes = req.result.sort((a,b) => b.id - a.id);
            const container = document.getElementById('notesContainer');
            container.innerHTML = '';
            notes.forEach(note => {
                let galleryHTML = '';
                if(note.images && note.images.length > 0) {
                    galleryHTML = `<div class="note-gallery">`;
                    note.images.forEach((imgSrc, index) => {
                        galleryHTML += `<img src="${imgSrc}" onclick="openGallery(${note.id}, ${index})">`;
                    });
                    galleryHTML += `</div>`;
                }

                // 3. HANDLE MISSING DATES FOR OLD NOTES
                const displayDate = note.date || new Date(note.id).toLocaleDateString();

                const div = document.createElement('div');
                div.className = 'note-card';
                div.innerHTML = `${galleryHTML}
                    <div class="note-body">
                        <div class="note-meta">
                            <span class="note-tag">${note.category || 'General'}</span>
                            <span class="note-date">📅 ${displayDate}</span>
                        </div>
                        <h3 class="note-title">${note.title}</h3>
                        <p>${note.content}</p>
                        <button class="delete-btn" onclick="deleteNote(${note.id})">Delete</button>
                    </div>`;
                container.appendChild(div);
            });
        };
    }

    function deleteNote(id) {
        if(confirm("Delete this note?")) {
            const tx = db.transaction([STORE_NAME], "readwrite");
            tx.objectStore(STORE_NAME).delete(id);
            tx.oncomplete = () => loadNotes();
        }
    }

    // ==========================================
    // FULL SCREEN GALLERY (TOUCH FIXED)
    // ==========================================
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');

    let currentGalleryImages = [];
    let currentImageIndex = 0;
    let currentScale = 1, initialScale = 1, initialDistance = 0;
    let posX = 0, posY = 0, startX = 0, startY = 0, lastPosX = 0, lastPosY = 0;
    let isDragging = false;

    function openGallery(noteId, startIndex) {
        const tx = db.transaction([STORE_NAME], "readonly");
        const req = tx.objectStore(STORE_NAME).get(noteId);
        req.onsuccess = () => {
            currentGalleryImages = req.result.images;
            currentImageIndex = startIndex;
            showLightboxImage();
            lightbox.style.display = 'flex';
        };
    }

    function showLightboxImage() {
        if(currentGalleryImages.length > 0) {
            lightboxImg.src = currentGalleryImages[currentImageIndex];
            currentScale = 1; posX = 0; posY = 0; lastPosX = 0; lastPosY = 0;
            updateTransform();
            updateNavButtons();
        }
    }

    function updateNavButtons() {
        prevBtn.style.display = (currentGalleryImages.length > 1 && currentImageIndex > 0) ? 'block' : 'none';
        nextBtn.style.display = (currentGalleryImages.length > 1 && currentImageIndex < currentGalleryImages.length - 1) ? 'block' : 'none';
    }

    function nextImage(e) {
        if(e) e.stopPropagation();
        if (currentImageIndex < currentGalleryImages.length - 1) {
            currentImageIndex++;
            showLightboxImage();
        }
    }

    function prevImage(e) {
        if(e) e.stopPropagation();
        if (currentImageIndex > 0) {
            currentImageIndex--;
            showLightboxImage();
        }
    }

    function closeLightbox(e) {
        if (!e || e.target === lightbox || e.target.id === 'close-lightbox') {
            lightbox.style.display = 'none';
        }
    }

    function updateTransform() {
        lightboxImg.style.transform = `translate(${posX}px, ${posY}px) scale(${currentScale})`;
    }

    lightbox.addEventListener('touchstart', (e) => {
        if(e.target.classList.contains('nav-btn') || e.target.id === 'close-lightbox') return;
        e.preventDefault(); 
        if (e.touches.length === 1) {
            isDragging = true;
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        } else if (e.touches.length === 2) {
            isDragging = false; 
            initialDistance = Math.hypot( e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
            initialScale = currentScale;
        }
    });

    lightbox.addEventListener('touchmove', (e) => {
        if(e.target.classList.contains('nav-btn') || e.target.id === 'close-lightbox') return;
        e.preventDefault();
        if (e.touches.length === 1 && isDragging && currentScale > 1) {
            const deltaX = e.touches[0].clientX - startX;
            const deltaY = e.touches[0].clientY - startY;
            posX = lastPosX + deltaX;
            posY = lastPosY + deltaY;
            updateTransform();
        } else if (e.touches.length === 2) {
            const currentDistance = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
            const scaleFactor = currentDistance / initialDistance;
            currentScale = Math.min(Math.max(0.5, initialScale * scaleFactor), 5);
            updateTransform();
        }
    });

    lightbox.addEventListener('touchend', (e) => {
        if(e.target.classList.contains('nav-btn') || e.target.id === 'close-lightbox') return;
        if (currentScale === 1 && isDragging && e.changedTouches.length === 1) {
            const touchEndX = e.changedTouches[0].clientX;
            const diffX = startX - touchEndX;
            if (diffX > 50) nextImage();
            else if (diffX < -50) prevImage();
        }
        lastPosX = posX; lastPosY = posY; isDragging = false;
        if (currentScale < 1) {
            currentScale = 1; posX = 0; posY = 0; lastPosX = 0; lastPosY = 0;
            lightboxImg.style.transition = 'transform 0.3s ease-out';
            updateTransform();
            setTimeout(() => { lightboxImg.style.transition = 'none'; }, 300);
        }
    });

</script>

</body>
</html>
